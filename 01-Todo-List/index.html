<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Modern To-Do List</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://kit.fontawesome.com/6b6b9d8e9d.js"
        crossorigin="anonymous"></script>

</head>

<body>

    <div class="container">

        <h1>📝 My To-Do List</h1>

        <!-- Theme Button -->

        <button id="themeBtn">
            🌙
        </button>

        <!-- Input Section -->

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task">

            <input
                type="date"
                id="dueDate">

        </div>

        <!-- Category -->

        <div class="options">

            <select id="category">

                <option value="College">
                    📚 College
                </option>

                <option value="Personal">
                    🏠 Personal
                </option>

                <option value="Work">
                    💼 Work
                </option>

            </select>

            <!-- Priority -->

            <select id="priority">

                <option value="High">
                    🔴 High
                </option>

                <option value="Medium">
                    🟡 Medium
                </option>

                <option value="Low">
                    🟢 Low
                </option>

            </select>

        </div>

        <button id="addBtn">
            Add Task
        </button>

        <!-- Search -->

        <input
            type="text"
            id="search"
            placeholder="🔍 Search Task">

        <!-- Filter -->

        <div class="filter-buttons">

            <button class="filter" data-filter="all">
                All
            </button>

            <button class="filter"
                data-filter="completed">
                Completed
            </button>

            <button class="filter"
                data-filter="pending">
                Pending
            </button>

        </div>

        <!-- Progress -->

        <div class="progress-container">

            <div id="progressBar">

            </div>

        </div>

        <p id="progressText">

            0 / 0 Completed

        </p>

        <!-- Tasks -->

        <ul id="taskList">

        </ul>

    </div>

    <script src="script.js"></script>

</body>

</html>
